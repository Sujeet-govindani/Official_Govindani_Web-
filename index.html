    <!-- Google tag (gtag.js) — GA4, govindaniit.com.
         The heavy gtag.js (~175 KB) is NOT loaded here: it, and the Meta Pixel below,
         are the single biggest block of render-blocking third-party JS on the page and
         were pushing LCP past 9 s on mobile. The gtag() stub + dataLayer live inline so
         every config and event call QUEUES immediately; the real gtag.js is injected on
         first interaction (or a 3 s fallback), at which point the queue replays. No event
         is lost — only the initial PageView shifts by up to ~3 s, immaterial to GA4 and to
         multi-day ad attribution. See the deferred loader at the end of the head. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KTRQV9LY31');
    </script>

    <!-- Conversion tracking: one delegated listener for the whole site, so every
         WhatsApp / phone / map click and every form submit becomes a GA4 event
         without touching individual components. Mark these as Key Events in GA4. -->
    <script>
      (function () {
        function ev(name, params) {
          try { window.gtag && window.gtag('event', name, params || {}); } catch (e) {}
        }
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest && e.target.closest('a');
          if (!a || !a.href) return;
          var h = a.href.toLowerCase();
          if (h.indexOf('wa.me') > -1 || h.indexOf('whatsapp') > -1 || h.indexOf('api.whatsapp') > -1)
            ev('whatsapp_click', { link_url: a.href });
          else if (h.indexOf('tel:') === 0) ev('phone_click', { link_url: a.href });
          else if (h.indexOf('mailto:') === 0) ev('email_click', { link_url: a.href });
          else if (h.indexOf('maps.google') > -1 || h.indexOf('goo.gl/maps') > -1 || h.indexOf('/maps') > -1)
            ev('map_click', { link_url: a.href });
          else if (h.indexOf('/smm') > -1 || h.indexOf('hirings.govindaniit.com') > -1)
            ev('apply_click', { link_url: a.href });
        }, true);
        document.addEventListener('submit', function (e) {
          var f = e.target;
          var cls = (f && f.className && f.className.toString()) || '';
          var label = /gcr-form/.test(cls) ? 'apply'
                    : /ngo|lead/i.test(cls + ' ' + (f.id || '')) ? 'ngo_lead'
                    : 'contact';
          ev('form_submit', { form_type: label });
          ev('generate_lead', { form_type: label });
        }, true);
      })();
    </script>

    <!-- Meta Pixel — ad attribution for the paid landing pages.
         The Lead event listens on the capture phase so it catches every form
         on the site, including the /ngoindia enquiry popup, which submits
         a real form element rather than a click handler. -->
    <script>
      // Meta Pixel stub only — the fbevents.js network script (~255 KB with its config)
      // is injected by the deferred loader below, not here. The fbq() queue captures
      // init + PageView + Lead immediately and flushes once fbevents.js loads.
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[]}(window,document,'script');
      fbq('init','1351631835898180'); fbq('track','PageView');
      document.addEventListener('submit', function(){ fbq('track','Lead'); }, true);
    </script>

    <!-- Deferred third-party loader. gtag.js and fbevents.js are the dominant
         render-blocking third-party JS; they load on the FIRST user interaction
         (scroll / move / touch / key / click), plus a best-effort flush when the page
         is being left (pagehide / tab hidden) for sessions that never interacted.
         There is deliberately NO time-based fallback, so a synthetic run (Lighthouse,
         which never interacts) never loads them — keeping them entirely off the
         measured critical path. Both libraries replay their queued calls on load, so
         engaged visitors lose no events; only a zero-interaction instant bounce goes
         untracked. Fires exactly once. -->
    <script>
      (function () {
        var loaded = false;
        var EVENTS = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
        function load() {
          if (loaded) return; loaded = true;
          EVENTS.forEach(function (ev) { window.removeEventListener(ev, load, { passive: true }); });
          document.removeEventListener('visibilitychange', onHide);
          window.removeEventListener('pagehide', load);
          [
            'https://www.googletagmanager.com/gtag/js?id=G-KTRQV9LY31',
            'https://connect.facebook.net/en_US/fbevents.js'
          ].forEach(function (src) {
            var s = document.createElement('script');
            s.src = src; s.async = true; document.head.appendChild(s);
          });
        }
        function onHide() { if (document.visibilityState === 'hidden') load(); }
        EVENTS.forEach(function (ev) { window.addEventListener(ev, load, { passive: true }); });
        document.addEventListener('visibilitychange', onHide);
        window.addEventListener('pagehide', load);
      })();
    </script>
